spring.application.name=twitter_challenge

# README: API 3000 portundan çalışır
server.port=3000

# PostgreSQL bağlantısı (kendi bilgilerinizi girin ya da ortam değişkeni verin)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/twitter}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# İlk çalıştırmada tabloları oluşturur, sonraki çalıştırmalarda veriyi silmez
spring.jpa.hibernate.ddl-auto=update

# Veritabanına giden SQL'leri loglarda görmek için
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug

# React ön yüzünün adresi (CORS)
app.cors.allowed-origins=http://localhost:3200
